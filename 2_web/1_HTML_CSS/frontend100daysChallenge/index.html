<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing - Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-card">
      <div class="img-card">
        <img src="image.jpg" alt="login-image">
      </div>
      <div class="login">
        <h1>Login</h1>
        <p>Don't have an account? <a href="#">Sign up</a></p>

        <br>
        <form action="">
          <p>Enter your username and password to login to your account.</p>
          <input type="text" placeholder="Username">
          <br>
          <p>Password</p>
          <input type="password" placeholder="Password">
          <a href="#">Forgot password?</a>
          <br>
          <br>
          <button>Login</button>
          <!-- checkbox -->
          <div class="checkbox">
            <input type="checkbox" id="i-agree">
            <label for="i-agree">I agree to the terms and conditions</label>
          </div>
        </form>
      </div>
    </div>
</body>
</html>
